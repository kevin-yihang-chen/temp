[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-entropy"
version = "0.3.0"
description = "Counterfactual value-of-information experiments for active visual agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Beyond Entropy research project"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]
semantic = ["torch>=2.2", "scikit-learn>=1.3"]
benchmark = ["datasets>=2.18", "Pillow>=10"]
qwen = [
  "accelerate>=0.26",
  "Pillow>=10",
  "qwen-vl-utils>=0.0.8",
  "torch>=2.4",
  "transformers>=4.49",
]

[project.scripts]
beyond-entropy = "beyond_entropy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
